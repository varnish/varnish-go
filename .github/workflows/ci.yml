name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    # Not ubuntu-latest: on Ubuntu 26.04 apt only fetches binary-amd64v3
    # indexes, which the Varnish Cache repo does not publish, so varnish-dev
    # cannot be found.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: varnish
            bootstrap: curl -Ls https://packages.varnish-software.com/varnish/bootstrap-deb.sh | sudo bash
            packages: varnish varnish-dev
          - name: varnish-plus
            bootstrap: curl -s https://packagecloud.io/install/repositories/varnishplus/60-enterprise/script.deb.sh | sudo INSTALL= bash
            packages: varnish-plus varnish-plus-dev
            test_tags: -tags varnish_plus

    name: Build and test against ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          # Disable shared build cache: OSS and Plus compile CGo against different
          # headers (offset 32 vs 24 for VSL_transaction.c); sharing the cache
          # causes the Plus job to use OSS-compiled artifacts, triggering a
          # SIGABRT in VSL_Next (priv_tbl=NULL from reading past struct end).
          cache: false

      - name: Install Varnish
        run: |
          ${{ matrix.bootstrap }}
          sudo apt-get update
          sudo apt-get install -qq ${{ matrix.packages }}
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ${{ matrix.test_tags }} ./...

      - name: Doc
        run: go list -f '{{if or .GoFiles .CgoFiles}}{{.ImportPath}}{{end}}' ./... | xargs -I{} go doc {}
